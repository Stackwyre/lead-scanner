name: Daily Lead Scan

on:
  schedule:
    - cron: '0 14 * * *'   # 2pm UTC daily
  workflow_dispatch:       # Manual trigger button

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser tweepy python-dateutil

      - name: Run scanner
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN || '' }}
        run: python scan.py | tee /tmp/daily-leads.md

      - name: Create Daily Leads Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/daily-leads.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Leads – ${date}`,
              body: body,
              labels: ['leads']
            });